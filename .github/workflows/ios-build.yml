# Сборка в облаке. Проверяет, что приложение собирается, на каждый толчок в
# репозиторий. Аккаунт Apple для этого не нужен: сборка для симулятора не
# подписывается.
name: Сборка iOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4


      - name: Взять самый новый Xcode на машине
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Проверить имена переменных в сценариях сборки
        run: |
          # Bash не принимает в именах ничего, кроме латиницы, цифр и
          # подчёркивания, а проверка синтаксиса этого не ловит: такая
          # строка разбирается как вызов команды. Дважды на этом обжёгся —
          # значит, проверять, а не помнить.
          python3 .github/проверить-сценарии.py

      - name: Проверить переводы
        run: |
          # Каждая надпись T("…", "…") переведена на все языки, и вставки
          # %@ в переводе те же (P369). Новая надпись без перевода
          # показалась бы по-английски — ловим здесь, а не на телефоне.
          python3 scripts/strings.py check

      - name: Проверить парность скобок
        run: |
          # Дешёвая проверка перед дорогой: срезанная скобка ловится за
          # секунду здесь, а не за четыре минуты компилятором на машине Apple.
          python3 - <<'PY'
          import io, glob, re, sys
          bad = []
          for f in sorted(glob.glob('ios/Chronotheca/*.swift') +
                          glob.glob('ios/ChronothecaTests/*.swift')):
              s = io.open(f, encoding='utf-8').read()
              s = re.sub(r'"""[\s\S]*?"""', '""', s)
              s = re.sub(r'"(\\.|[^"\\])*"', '""', s)
              s = re.sub(r'//[^\n]*', '', s)
              if s.count('{') != s.count('}'):
                  bad.append(f"{f}: {{ {s.count('{')} }} {s.count('}')}")
          if bad:
              print("::error::скобки не сходятся: " + "; ".join(bad))
              sys.exit(1)
          print("скобки сходятся")
          PY

      - name: Поставить XcodeGen
        run: brew install xcodegen

      - name: Собрать проект Xcode из project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Выбрать симулятор
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid']); raise SystemExit
          sys.exit('нет доступного симулятора iPhone')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Собрать приложение и прогнать проверки формата
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Chronotheca.xcodeproj \
            -scheme Chronotheca \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
