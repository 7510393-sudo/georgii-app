# Проверки движения (P552): клавиатура, «Сегодня», листание, лишние строки
# кнопок. Снимки экрана не видят хода — эти проверки трогают приложение
# пальцем в симуляторе. Сборку в TestFlight не держат: итог и снимки с
# клавиатурой кладутся в docs/motion/.
name: Проверки движения

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/movement.yml'

permissions:
  contents: write

concurrency:
  group: movement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  movement:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Взять самый новый Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Поставить XcodeGen
        run: brew install xcodegen

      - name: Собрать проект Xcode из project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Выбрать симулятор
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid']); raise SystemExit
          sys.exit('нет доступного симулятора iPhone')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Прогнать проверки движения
        id: run
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_MOTION_DIR: ${{ github.workspace }}/docs/motion
        run: |
          set -o pipefail
          rm -rf ../docs/motion && mkdir -p ../docs/motion
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Место заранее запрещено: окна-вопроса о нём быть не должно.
          xcrun simctl privacy "$UDID" revoke location com.kobiashvili.diary || true
          # Чем занято приложение (P571): пока идут проверки, раз в 12 секунд
          # снимаем, что делает его главный поток, — по этим снимкам видно,
          # что тормозит на большом архиве.
          (
            n=0
            while [ $n -lt 40 ]; do
              sleep 12
              log=../docs/motion/sampler.txt
              pid=$(pgrep -f "Chronotheca.app/Chronotheca" | head -1)
              if [ -n "$pid" ]; then
                n=$((n + 1))
                if ! sample "$pid" 2 -file "../docs/motion/sample-$n.txt" >>"$log" 2>&1; then
                  echo "снимок $n: sample не смог, пробую sudo" >> "$log"
                  sudo sample "$pid" 2 -file "../docs/motion/sample-$n.txt" >>"$log" 2>&1 \
                    || echo "снимок $n не снялся (pid $pid)" >> "$log"
                fi
              else
                echo "$(date -u +%T) приложения нет среди процессов:" >> "$log"
                ps axo pid,comm | grep -i -E "chrono|xctrunner" | head -5 >> "$log"
              fi
            done
          ) &
          sampler=$!
          status=0
          xcodebuild test \
            -project Chronotheca.xcodeproj \
            -scheme Movement \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log || status=$?
          kill $sampler 2>/dev/null || true
          # Из каждого снимка — только главный поток, самые тяжёлые места.
          for f in ../docs/motion/sample-*.txt; do
            [ -f "$f" ] || continue
            {
              awk '/DispatchQueue_1: com.apple.main-thread/{on=1; print; next} on&&/^    [0-9]+ Thread_/{exit} on&&/^    \+/{print}' "$f" | head -400
              echo
              sed -n '/Sort by top of stack/,$p' "$f" | head -40
            } > "$f.main"
            mv "$f.main" "$f"
          done
          {
            echo "Проверки движения, $(date -u '+%Y-%m-%d %H:%M') UTC, коммит ${GITHUB_SHA:0:7}"
            echo
            grep -E "Test Case .*(passed|failed)|error: -\[|XCTAssert" test.log || echo "строк итога нет — смотри журнал прогона"
            echo
            grep -E "ЗАМЕР " test.log | sed 's/.*ЗАМЕР /замер /' || true
          } > ../docs/motion/итог.txt
          cat ../docs/motion/итог.txt >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Положить итог и снимки в репозиторий
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FRESH=$(mktemp -d)
          cp -R docs/motion/. "$FRESH"/ 2>/dev/null || exit 0
          for try in 1 2 3 4; do
            git add docs/motion
            if git diff --cached --quiet; then
              echo "итог не изменился"
              exit 0
            fi
            git commit -m "docs: проверки движения [skip ci]"
            if git push; then exit 0; fi
            echo "отправка не прошла, попытка $try"
            sleep $((try * 5))
            git fetch origin "$GITHUB_REF_NAME" || exit 1
            git reset --hard "origin/$GITHUB_REF_NAME" || exit 1
            rm -rf docs/motion && mkdir -p docs/motion
            cp -R "$FRESH"/. docs/motion/
          done
          echo "::warning::итог не удалось отправить в репозиторий"
